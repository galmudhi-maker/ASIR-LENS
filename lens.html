
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>عدسة عسير | اكتشف عسير</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .places-container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
    }
    .places-title { text-align: center; margin-bottom: 10px; }
    .places-intro { text-align: center; margin-bottom: 25px; }
    .search-box {
      display: block;
      width: 100%;
      max-width: 500px;
      padding: 13px;
      margin: 20px auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 25px;
    }
    .filters button {
      padding: 9px 16px;
      border: 1px solid #52745b;
      border-radius: 20px;
      background: white;
      color: #31543b;
      cursor: pointer;
    }
    .filters button.active {
      background: #31543b;
      color: white;
    }
    .places-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }
    .place-card {
      padding: 20px;
      border-radius: 14px;
      border: 1px solid #e2e2e2;
      background: white;
      box-shadow: 0 3px 10px #0000000d;
    }
    .place-card h3 { margin-top: 0; }
    .place-card a {
      display: inline-block;
      margin-top: 10px;
      color: #31543b;
      font-weight: bold;
    }
    #noResults { text-align: center; display: none; }
  </style>
</head>
<body>
  <main class="places-container">
    <h1 class="places-title">عدسة عسير 🌿</h1>
    <p class="places-intro">اكتشف جمال عسير ومعالمها السياحية والتراثية.</p>

    <input
      id="searchInput"
      class="search-box"
      type="search"
      placeholder="ابحث عن مكان في عسير..."
      aria-label="البحث عن مكان"
    >

    <div class="filters">
      <button class="active" data-category="all">الكل</button>
      <button data-category="nature">طبيعة</button>
      <button data-category="heritage">تراث</button>
      <button data-category="culture">ثقافة وتسوق</button>
